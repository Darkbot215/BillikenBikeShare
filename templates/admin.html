<!DOCTYPE html>

    <style>
        :root {
            --font-size-1: clamp(28px, 7vw, 55px);
            --font-size-2: clamp(16px, 5vw, 32px);
        }
        body {
            font-family: Arial, sans-serif;
            padding: 5vw;
            font-size: var(--font-size-2); /* scales with screen width */
            background-color: #e7f1fa; /* light blue accent */

        }
        #textboxA, #textboxB {
            margin-top: 3vw;   /* space above the box */
            margin-bottom: 3vw; /* space below the box */
        }


        h3 {
            font-size: var(--font-size-1); /* scale heading size */
        }
        h4 {
            font-size: var(--font-size-2);

        }

        textarea {
            width: 100%;
            height: 10vh;        /* fills large portion of screen vertically */
            font-size: var(--font-size-2);       /* scale text size */
            padding: 2vw;
            box-sizing: border-box;
            border-radius: 2vw;
            border: 1px solid #999;
            resize: vertical;         /* prevents weird resizing on mobile */
        }

        button {
            margin-top: 4vw;
            padding: 3vw 5vw;
            font-size: var(--font-size-2);
            border-radius: 2vw;
            border: none;
            background: #4a90e2;
            color: white;
            width: 100%;          /* full-width button */
        }
        .dropdown {
            width: 100%;
            padding: 2vw;
            font-size: var(--font-size-2);
            border-radius: 2vw;
            border: 1px solid #999;
            margin-top: 3vw;
            background-color: white; /* optional */
        }

        #response {
            margin-top: 4vw;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: var(--font-size-2);      /* scales with screen width on mobile */
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f0f0f0;
        }
        .file-input {
            width: 100%;
            font-size: var(--font-size-2);          /* scales with screen width */
            /*margin-top: 2vw;*/
        }

        /* Optional: slightly nicer on modern browsers */
        .file-input::file-selector-button {
            font-size: var(--font-size-2);
            padding: 2vw 4vw;
            border-radius: 2vw;
            border: none;
            background-color: #4a90e2;
            color: white;
        }

        /* Fallback for older mobile browsers */
        .file-input::-webkit-file-upload-button {
            font-size: var(--font-size-2);
            padding: 2vw 4vw;
        }
        .form-control {
            width: 100%;
            margin-top: 4vw;   /* THIS is the spacing */
        }
        #overlaySpinner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.7); /* semi-transparent overlay */
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999; /* make sure it’s above everything */
        }

        .spinner {
            border: 0.6vw solid #f3f3f3;
            border-top: 0.6vw solid #4a90e2;
            border-radius: 50%;
            width: 10vw;
            height: 10vw;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .page {
            max-width: 900px;     /* desktop-friendly width */
            margin: 0 auto;       /* center on desktop */
        }
        .date-input {
            width: 100%;
            font-size: var(--font-size-2); /* match your textareas/dropdowns */
            padding: 2vw;                   /* large clickable area */
            border-radius: 2vw;
            border: 1px solid #999;
            box-sizing: border-box;

            
            transform: scale(3);   /* 1.5x bigger */
            transform-origin: top left; /* keeps alignment correct */
                /* improves vertical alignment */

            /* optional: nicer background */
            background-color: white;
        }


        /* Optional: make the calendar icon bigger */
        .date-input::-webkit-calendar-picker-indicator {
            cursor: pointer;
            padding: 0.5em;                 /* makes the icon easier to tap */
        }



        @media (min-width: 768px) {
            body {
                background-color: #a0c4e3; /* darker outside */
                display: flex;
                justify-content: center;   /* horizontal center */
                align-items: flex-start;   /* vertical start, so content starts at top */
                min-height: 100vh;         /* full height */
                /*padding: 4vw 0;    */        /* vertical spacing from edges */
            }

            .page {
                max-width: 900px;
                width: 100%;
                background-color: #e7f1fa; /* light blue inside */
                border: 1px solid #ccc;
                border-radius: 8px;
                padding: 24px;
                box-shadow: 0 2px 6px rgba(0,0,0,0.1);
                margin: 0; /* handled by flex centering */
            }
            body {
                padding: 24px;
            }

            #textboxA,
            #textboxB {
                margin-top: 16px;
                margin-bottom: 16px;
            }
            

            .form-control {

            }

            button {
                width: 100%;            /* stop full-width stretching */
                display: block;         /* allows centering */
                margin-left: auto;
                margin-right: auto;
                margin-top: 16px;       /* reduce spacing above buttons */
                padding: 12px 24px;     /* smaller padding than mobile */
            }

            textarea,
            .dropdown,

                padding: 12px;
                border-radius: 10px;
            }

            h3 {
                margin-bottom: 12px;
            }
             .file-input {
                width: 100%;            /* smaller width on desktop */
                margin-left: auto;
                margin-right: auto;    /* center */

            }

            .file-input::file-selector-button,
            .file-input::-webkit-file-upload-button {

            }

        }
    </style>
</head>

    <script>
        const adminActions = {

        function fillDropdown(listy, text = "") {
            const select = document.getElementById("mySelect");

            select.innerHTML = "";
            if (text){
                const option = document.createElement("option");

                option.value = -1;
                option.textContent = text;
                select.appendChild(option);
            }

            listy.forEach(item => {
                const option = document.createElement("option");
                option.value = item;
                option.textContent = item;
                select.appendChild(option);
            })
        }
        function hideAllPageElements(clearContent = true) {
            // List of all elements you want to hide
            const elementsToHide = [
                "toptext",
                "textboxA",
                "textboxB",
                "bikeTable",
                "bikeTable2",
                "photoInput",
                "input",
                "inputB",
                "mySelect",
                "buttonA",
                "buttonB",
                "dateInput",

            ];

            elementsToHide.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.style.display = "none";
                    if (clearContent) {
                        if (el.tagName === "TABLE") {
                            el.innerHTML = "";
                        } else if ("value" in el) {
                            el.value = "";
                        } else {
                            el.innerHTML = "";
                        }
                    }
                }
            });
        }

        function buildTable({
            tableId,
            headingText = "",
            headers = [],
            rows = [],
            defaultCellColor = "#FFFFFF"
        }) {
            // Set heading (optional)
            if (headingText) {
                document.getElementById("textboxA").innerText = headingText;
            }

            const table = document.getElementById(tableId);
            table.innerHTML = "";

            // Build header
            if (headers.length > 0) {
                const thead = document.createElement("thead");
                const tr = document.createElement("tr");

                headers.forEach(h => {
                    const th = document.createElement("th");
                    th.textContent = h;
                    tr.appendChild(th);
                });

                thead.appendChild(tr);
                table.appendChild(thead);
            }

            // Build body
            const tbody = document.createElement("tbody");

            rows.forEach(rowData => {
                const tr = document.createElement("tr");

                rowData.forEach(cell => {
                    const td = document.createElement("td");
                    td.textContent = cell.value;
                    td.style.backgroundColor = cell.color || defaultCellColor;
                    tr.appendChild(td);
                });

                tbody.appendChild(tr);
            });

            table.appendChild(tbody);
        }

        function fetchWithTimeout(url, options = {}, timeout = 20000) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);

            return fetch(url, {
                ...options,
                signal: controller.signal
            })
            .then(async res => {
                clearTimeout(id);

                let data;
                try {
                    data = await res.json();
                } catch {
                    data = null;
                }

                if (!res.ok) {
                    // 🔑 THIS preserves your Flask error message
                    const msg = data?.error || `Server responded with ${res.status}`;
                    throw new Error(msg);
                }

                return data;
            })
            .catch(err => {
                clearTimeout(id);
                if (err.name === "AbortError") {
                    throw new Error("Request timed out");
                }
                throw err;
            });
        }


        /* This function loads the page with data */
        function populatePage()
        {

            const urlParams = new URLSearchParams(window.location.search);
            //The url having ?bike=# tells which bike it is for

            //const overlay = document.getElementById("overlaySpinner");
           // overlay.style.display = "flex";
            if(loginCode){

            }
            
        }
        function generateCode()
        {   
            const overlay = document.getElementById("overlaySpinner");
            overlay.style.display = "flex";

            fetchWithTimeout("/generateAdminCode").then(data =>{
                    // If there is no bike id then do this with data
                    overlay.style.display = "none";

                document.getElementById("textboxB").innerText = "";
                document.getElementById("photoInput").style.display = "none";
                document.getElementById("buttonB").style.display = "none";
                document.getElementById("toptext").innerText = data.topText;
                document.getElementById("textboxA").innerHTML = data.textbox;
                const select = document.getElementById("mySelect");
                select.style.display = "none";
                document.getElementById("input").style.display = "none";


            }).catch(err => {
                overlay.style.display = "none";
                if (err.message.includes("<")) {
                    document.getElementById("textboxA").innerHTML =
                        `<b style="color:red">ERROR:</b> ${err.message}`;
                } else {
                    alert(`ERROR: ${err.message}`)
                }
                console.error(err);
            });
        }
        function submitPassword()

            fetchWithTimeout("/adminLogin", {

                document.getElementById("buttonA").style.display = "none";

                document.getElementById("buttonB").style.display = "block";
                document.getElementById("buttonB").onclick = nextPage;

                document.getElementById("inputB").value = "";



            }).catch(err => {

                if (err.message.includes("<")) {

                } else {

                }
                console.error(err);

        function nextPage()

            const action = adminActions[selectedText];
            if (typeof action === "function") {

            }
        }
        function getAllBikeLockCodes()

            const overlay = document.getElementById("overlaySpinner");

                if (err.message.includes("<")) {
                    document.getElementById("textboxA").innerHTML =
                        `<b style="color:red">ERROR:</b> ${err.message}`;
                } else {
                    alert(`ERROR: ${err.message}`)
                }
                console.error(err);
            });

        }

        function reloadSiteSettings() {
            const overlay = document.getElementById("overlaySpinner");
            overlay.style.display = "flex";


            fetchWithTimeout("/reloadSiteSettings", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ loginCode })
            }).then(data =>{
                overlay.style.display = "none";

                document.getElementById("toptext").innerText = "Success at reloading site settings";
                document.getElementById("textboxA").innerText = "The site has updated with the new OS settings";

                
                document.getElementById("toptext").style.display = "block";
                document.getElementById("textboxA").style.display = "block";
            }).catch(err => {
                overlay.style.display = "none";
                if (err.message.includes("<")) {
                    document.getElementById("textboxA").innerHTML =
                        `<b style="color:red">ERROR:</b> ${err.message}`;
                } else {
                    alert(`ERROR: ${err.message}`)
                }
                console.error(err);
            });
        }

        let loginCode = null;

        window.onload = populatePage;


        
    </script>
    </div>
