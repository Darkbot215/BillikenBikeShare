name: Repository Keepalive

on:
  schedule:
    - cron: "0 12 * * 1"   # Every Monday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create keepalive commit if needed
        run: |
          LAST_COMMIT=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          DAYS=$(( (NOW - LAST_COMMIT) / 86400 ))

          echo "Last commit was $DAYS days ago."

          if [ "$DAYS" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git commit --allow-empty -m "Keep repository active"
            git push
          else
            echo "No keepalive commit needed."
          fi