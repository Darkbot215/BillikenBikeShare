name: Keep Render Awake

on:
  schedule:
    # Runs every 13 minutes from 7am - 11 pm (because I don't mind my site shutting down for a bit tbh)
    - cron: "*/13 12-23 * * *"  # 12:00–23:59 UTC
    - cron: "*/13 0-5 * * *"    # 00:00–05:59 UTC (next day)
  # Allows manual runs from the GitHub UI
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ping Render health endpoint
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: |
          python keepAwake.py
